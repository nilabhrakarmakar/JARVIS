<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0b1020">
  <title>J.A.R.V.I.S. — Command Center</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/app.css">
</head>
<body>
  <aside class="sidebar" id="sidebar">
    <div class="brand"><div class="brand-mark">J</div><div><strong>J.A.R.V.I.S.</strong><small>Command Center</small></div></div>
    <button class="new-chat" id="newChat">＋ New chat</button>
    <div class="section-label">Session</div>
    <div class="session-card"><span class="status-dot"></span><div><b id="sessionName">Guest</b><small>Online</small></div></div>
    <div class="section-label">Recent chats</div>
    <div id="history" class="history"></div>
    <div class="sidebar-bottom"><button class="ghost" id="clearMemory">Clear memory</button><button class="ghost" id="themeToggle">Toggle theme</button></div>
  </aside>

  <main class="app-shell">
    <header class="topbar">
      <button class="icon-btn" id="menuBtn" aria-label="Open menu">☰</button>
      <div><span class="eyebrow">AI ASSISTANT</span><h1>J.A.R.V.I.S.</h1></div>
      <div class="metrics"><span>CPU <b id="cpu">--</b></span><span>RAM <b id="ram">--</b></span></div>
    </header>

    <section class="content" id="content">
      <div class="hero" id="hero">
        <div class="orb"><span></span></div>
        <p class="eyebrow">SYSTEM READY</p>
        <h2 id="greeting">Good evening, Guest.</h2>
        <p class="subtitle">What would you like me to work on?</p>
        <div class="suggestions">
          <button data-prompt="Explain a complex topic in simple Hinglish">Explain something</button>
          <button data-prompt="Write a clean Python script for me">Write code</button>
          <button data-prompt="Give me the latest news today">Latest news</button>
          <button data-prompt="What is the weather in Kolkata today?">Check weather</button>
        </div>
      </div>
      <div id="chatbox" class="chatbox" aria-live="polite"></div>
    </section>

    <footer class="composer-wrap">
      <div id="attachment" class="attachment"></div>
      <form id="composer" class="composer">
        <input type="file" id="file" hidden accept=".pdf,.txt,.csv,.c,.cpp,.html,.py,.md,.png,.jpg,.jpeg">
        <button type="button" class="icon-btn" id="attach" title="Attach file">＋</button>
        <input id="message" autocomplete="off" placeholder="Ask J.A.R.V.I.S. anything…" maxlength="8000">
        <button class="send" id="send" type="submit" title="Send">➤</button>
      </form>
      <p class="disclaimer">J.A.R.V.I.S. can make mistakes. Verify important information.</p>
    </footer>
  </main>

  <script src="/static/js/app.js" defer></script>
</body>
</html>
